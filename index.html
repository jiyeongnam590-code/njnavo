<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#cfdae5">
  <title>NJNAVO</title>
  <style>
    :root {
      --ink: #10251d;
      --paper: rgba(248, 250, 246, .84);
      --line: rgba(16, 37, 29, .16);
      --accent: #caff43;
      --shadow: 0 18px 55px rgba(8, 29, 21, .22);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      color: var(--ink);
      font-family: Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
      background: #b9c9d7;
    }

    button, a { font: inherit; }

    .desktop {
      position: relative;
      width: 100vw;
      height: 100dvh;
      min-height: 620px;
      overflow: hidden;
      isolation: isolate;
      background-image:
        linear-gradient(180deg, rgba(222, 232, 241, .08), rgba(8, 27, 19, .06)),
        url("https://raw.githubusercontent.com/jiyeongnam590-code/njnavo/main/main-bg.png");
      background-position: center 42%;
      background-size: cover;
    }

    .desktop::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,255,255,.07) 0%, transparent 46%, rgba(4,18,11,.12) 100%),
        radial-gradient(circle at 50% 15%, transparent 35%, rgba(15,35,27,.08) 100%);
    }

    .topbar {
      position: absolute;
      z-index: 20;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--ink);
      text-decoration: none;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .wordmark::before {
      content: "";
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px rgba(202,255,67,.23);
    }

    .nav {
      display: flex;
      gap: 6px;
      padding: 5px;
      border: 1px solid rgba(255,255,255,.38);
      border-radius: 999px;
      background: rgba(242,247,246,.45);
      box-shadow: 0 8px 28px rgba(10,31,24,.09);
      backdrop-filter: blur(12px);
    }

    .nav button,
    .nav a {
      display: inline-grid;
      place-items: center;
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      border-radius: 999px;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .04em;
      text-decoration: none;
    }

    .nav button:hover,
    .nav button:focus-visible,
    .nav a:hover,
    .nav a:focus-visible {
      outline: none;
      background: rgba(255,255,255,.7);
    }

    .intro {
      position: absolute;
      z-index: 5;
      top: 15%;
      left: 50%;
      width: min(720px, calc(100% - 48px));
      transform: translateX(-50%);
      text-align: center;
      pointer-events: none;
      animation: intro-in .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(38px, 5.3vw, 78px);
      line-height: 1.02;
      letter-spacing: -.055em;
      text-wrap: balance;
      text-shadow: 0 3px 24px rgba(8, 30, 24, .42);
    }

    .lead {
      margin: 18px auto 0;
      max-width: 530px;
      font-size: clamp(14px, 1.35vw, 18px);
      line-height: 1.65;
      font-weight: 600;
      text-wrap: balance;
    }

    .icon-layer {
      /* 아이콘 묶음 위치: top 숫자를 바꾸면 전체가 위·아래로 이동합니다. */
      position: absolute;
      z-index: 10;
      left: 50%;
      top: clamp(390px, 54vh, 540px);
      display: grid;
      /* PC 배열: repeat(3, ...)은 한 줄에 3개, gap은 세로·가로 간격입니다. */
      grid-template-columns: repeat(3, 96px);
      gap: 38px 58px;
      width: max-content;
      transform: translateX(-50%);
    }

    .project-icon {
      --x: 0px;
      --y: 0px;
      --r: 0deg;
      --icon-size: 96px;
      position: relative;
      width: var(--icon-size);
      padding: 0;
      border: 0;
      color: var(--ink);
      background: transparent;
      cursor: pointer;
      text-align: center;
      transform: translate3d(var(--x), var(--y), 0) rotate(var(--r));
      transition: transform .65s cubic-bezier(.18,.85,.25,1), filter .3s ease;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
    }

    .project-icon:hover,
    .project-icon:focus-visible {
      z-index: 3;
      outline: none;
      filter: drop-shadow(0 12px 16px rgba(9,31,22,.22));
    }

    .project-icon:hover .icon-shape,
    .project-icon:focus-visible .icon-shape {
      transform: translateY(-8px) rotate(-2deg) scale(1.08);
      background: rgba(255,255,255,.28);
    }

    .icon-shape {
      position: relative;
      display: grid;
      width: var(--icon-size);
      height: var(--icon-size);
      margin: 0 auto;
      place-items: center;
      border: 1px solid rgba(255,255,255,.66);
      border-radius: 28%;
      color: #fff;
      background: rgba(255,255,255,.16);
      box-shadow: 0 13px 26px rgba(9,30,22,.18), inset 0 1px 0 rgba(255,255,255,.42);
      backdrop-filter: blur(5px);
      transition: transform .38s cubic-bezier(.2,.8,.2,1), background .3s ease;
    }

    .icon-shape::before {
      content: none;
    }

    .icon-shape svg {
      display: block;
      width: 54%;
      height: 54%;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      filter: drop-shadow(0 2px 7px rgba(14,39,29,.28));
    }

    .icon-name {
      display: block;
      width: max-content;
      max-width: 150px;
      margin: 9px 50% 0;
      padding: 4px 8px;
      transform: translateX(-50%);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: .03em;
      text-align: center;
      text-shadow: 0 2px 8px rgba(8,30,22,.66);
      white-space: nowrap;
      pointer-events: none;
    }

    .hint {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%);
      padding: 9px 14px;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      background: rgba(235,241,238,.48);
      backdrop-filter: blur(9px);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .03em;
      white-space: nowrap;
    }

    .modal-backdrop {
      position: fixed;
      z-index: 40;
      inset: 0;
      display: grid;
      padding: 24px;
      place-items: center;
      visibility: hidden;
      opacity: 0;
      background: rgba(7,22,16,.24);
      backdrop-filter: blur(8px);
      transition: opacity .3s ease, visibility .3s ease;
    }

    .modal-backdrop.open {
      visibility: visible;
      opacity: 1;
    }

    .window {
      width: min(760px, 100%);
      max-height: min(620px, calc(100dvh - 48px));
      overflow: auto;
      border: 1px solid rgba(255,255,255,.75);
      border-radius: 26px;
      background: rgba(248,250,246,.9);
      box-shadow: var(--shadow);
      transform: translateY(20px) scale(.96);
      transition: transform .42s cubic-bezier(.2,.8,.2,1);
    }

    .modal-backdrop.open .window { transform: none; }

    .window-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(248,250,246,.88);
      backdrop-filter: blur(12px);
    }

    .window-title {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
    }

    .close {
      display: grid;
      width: 36px;
      height: 36px;
      padding: 0;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--ink);
      background: rgba(255,255,255,.55);
      cursor: pointer;
      font-size: 19px;
    }

    .window-content { padding: clamp(28px, 5vw, 58px); }

    .window-kicker {
      margin: 0 0 12px;
      color: #51655c;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .window h2 {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 1;
      letter-spacing: -.05em;
    }

    .window-copy {
      max-width: 560px;
      margin: 22px 0 0;
      color: #35483f;
      font-size: 15px;
      line-height: 1.75;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 28px;
    }

    .tag {
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .project-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 28px;
      padding: 12px 18px;
      border-radius: 999px;
      color: var(--ink);
      background: var(--accent);
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 22px rgba(16,37,29,.13);
    }

    .project-link:hover,
    .project-link:focus-visible {
      outline: 2px solid rgba(16,37,29,.35);
      outline-offset: 3px;
    }

    @keyframes intro-in {
      from { opacity: 0; transform: translate(-50%, 16px); }
    }

    @media (max-width: 760px) {
      html,
      body {
        height: 100%;
        min-height: 100%;
      }

      .desktop {
        width: 100%;
        height: 100svh;
        min-height: 0;
        background-position: 50% 44%;
      }

      .topbar {
        top: max(14px, env(safe-area-inset-top));
        left: 16px;
        right: 16px;
      }

      .wordmark {
        gap: 8px;
        font-size: 14px;
      }

      .wordmark::before {
        width: 9px;
        height: 9px;
        box-shadow: 0 0 0 4px rgba(202,255,67,.23);
      }

      .nav {
        padding: 3px;
      }

      .nav button,
      .nav a {
        min-height: 36px;
        padding: 0 8px;
        font-size: 10px;
      }

      .intro {
        top: clamp(78px, 12.5svh, 108px);
        width: calc(100% - 36px);
      }

      .eyebrow {
        margin-bottom: 9px;
        font-size: 8px;
        letter-spacing: .16em;
      }

      h1 {
        font-size: clamp(29px, 9vw, 40px);
        line-height: 1.07;
        letter-spacing: -.05em;
      }

      .lead {
        max-width: 310px;
        margin-top: 11px;
        font-size: 11px;
        line-height: 1.5;
      }

      .icon-layer {
        top: clamp(330px, 45svh, 390px);
        grid-template-columns: repeat(2, clamp(70px, 20vw, 82px));
        gap: clamp(22px, 3.5svh, 34px) clamp(42px, 13vw, 62px);
      }

      .project-icon {
        --icon-size: clamp(70px, 20vw, 82px);
      }

      .icon-shape {
        border-radius: 26%;
        box-shadow: 0 9px 20px rgba(9,30,22,.17), inset 0 1px 0 rgba(255,255,255,.42);
      }

      .icon-name {
        width: max-content;
        max-width: 105px;
        margin-top: 6px;
        padding: 3px 5px;
        font-size: 8px;
        letter-spacing: .02em;
      }

      .hint {
        bottom: max(12px, env(safe-area-inset-bottom));
        padding: 7px 10px;
        font-size: 9px;
      }

      .window {
        width: calc(100% - 24px);
        max-height: calc(100svh - 24px);
        border-radius: 22px;
      }

      .window-bar {
        padding: 12px 14px;
      }

      .window-content {
        padding: 24px 18px 28px;
      }

      .window h2 {
        font-size: clamp(32px, 12vw, 48px);
      }

      .window-copy {
        margin-top: 16px;
        font-size: 13px;
        line-height: 1.65;
      }
    }

    @media (max-width: 380px), (max-height: 700px) and (max-width: 760px) {
      .intro {
        top: clamp(72px, 11svh, 88px);
      }

      h1 {
        font-size: clamp(27px, 8.8vw, 34px);
      }

      .lead {
        max-width: 280px;
        font-size: 10px;
      }

      .project-icon {
        --icon-size: clamp(58px, 17vw, 66px) !important;
      }

      .icon-layer {
        top: clamp(285px, 43svh, 330px);
        grid-template-columns: repeat(2, clamp(58px, 17vw, 66px));
        gap: 18px clamp(42px, 14vw, 56px);
      }

      .hint {
        display: none;
      }
    }

    @media (max-width: 760px) and (orientation: landscape) {
      .desktop {
        min-height: 340px;
        background-position: center 46%;
      }

      .intro {
        top: 18%;
        left: 27%;
        width: 44%;
      }

      .eyebrow,
      .lead {
        display: none;
      }

      h1 {
        font-size: clamp(25px, 5vw, 38px);
      }

      .icon-layer {
        top: 24%;
        left: 71%;
        grid-template-columns: repeat(3, clamp(52px, 8vw, 62px));
        gap: 26px 20px;
      }

      .project-icon {
        --icon-size: clamp(52px, 8vw, 62px) !important;
      }

      .hint {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="desktop" id="desktop">
    <header class="topbar">
      <!-- 이미지 로고가 확정되면 이 글자형 워드마크를 img 요소로 교체하면 됩니다. -->
      <a class="wordmark" href="index.html" aria-label="NJNAVO 홈">◇ NJNAVO ◇</a>
      <nav class="nav" aria-label="주요 메뉴">
        <button type="button" data-open="ABOUT">ABOUT</button>
        <button type="button" data-open="CONTACT">CONTACT</button>
        <a href="sitemap.html">SITEMAP</a>
      </nav>
    </header>

    <section class="intro" aria-labelledby="main-title">
      <p class="eyebrow">Planning · UX/UI · Content · Data</p>
      <h1 id="main-title">생각을 구조로,<br>일상을 더 편리하게.</h1>
      <p class="lead">일상의 불편을 발견하고 보기 쉬운 디지털 경험으로 연결하는 NJNAVO의 작업 공간입니다.</p>
    </section>

    <section class="icon-layer" aria-label="프로젝트">
      <button class="project-icon" type="button" data-project="ABOUT" aria-label="소개 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="17" r="8"></circle>
            <path d="M9 42c1-10 6-15 15-15s14 5 15 15"></path>
            <path d="M35 9h8M39 5v8"></path>
          </svg>
        </span>
        <span class="icon-name">ABOUT ME</span>
      </button>

      <button class="project-icon" type="button" data-project="HOME TABLE" aria-label="홈 테이블 프로젝트 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="25" r="14"></circle>
            <circle cx="24" cy="25" r="7"></circle>
            <path d="M8 8v12M5 8v8a3 3 0 0 0 6 0V8M40 8v32M35 18c0-6 2-10 5-10"></path>
          </svg>
        </span>
        <span class="icon-name">HOME TABLE</span>
      </button>

      <button class="project-icon" type="button" data-project="BRANDING" aria-label="브랜딩 프로젝트 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="M10 36 33 13l6 6-23 23-8 2 2-8Z"></path>
            <path d="m29 17 6 6M10 36l6 6"></path>
            <circle cx="14" cy="13" r="5"></circle>
          </svg>
        </span>
        <span class="icon-name">BRANDING</span>
      </button>

      <button class="project-icon" type="button" data-project="NAENGIL" aria-label="냉일 프로젝트 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="12" y="5" width="24" height="38" rx="5"></rect>
            <path d="M12 22h24M31 12v5M31 27v6"></path>
            <path d="M19 14c3-4 7-4 10 0"></path>
          </svg>
        </span>
        <span class="icon-name">NAENGIL</span>
      </button>

      <button class="project-icon" type="button" data-project="WEB & CONTENT" aria-label="웹과 콘텐츠 프로젝트 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <rect x="5" y="8" width="38" height="30" rx="4"></rect>
            <path d="M5 16h38M11 12h.01M16 12h.01M21 12h.01"></path>
            <path d="M12 24h11v8H12zM28 24h8M28 29h8"></path>
          </svg>
        </span>
        <span class="icon-name">WEB & CONTENT</span>
      </button>

      <button class="project-icon" type="button" data-project="QGIS" aria-label="QGIS 프로젝트 열기">
        <span class="icon-shape">
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <path d="m6 14 12-6 12 6 12-6v28l-12 6-12-6-12 6V14Z"></path>
            <path d="M18 8v28M30 14v28"></path>
            <path d="M26 23a5 5 0 1 1 10 0c0 5-5 10-5 10s-5-5-5-10Z"></path>
          </svg>
        </span>
        <span class="icon-name">QGIS</span>
      </button>
    </section>

    <p class="hint">마우스를 아이콘 가까이 움직여 보세요 · 클릭하면 열립니다</p>
  </main>

  <div class="modal-backdrop" id="modal" role="dialog" aria-modal="true" aria-labelledby="window-heading">
    <article class="window">
      <header class="window-bar">
        <span class="window-title" id="window-label">NJNAVO PROJECT</span>
        <button class="close" type="button" aria-label="창 닫기">×</button>
      </header>
      <div class="window-content">
        <p class="window-kicker" id="window-kicker">Selected project</p>
        <h2 id="window-heading">NAENGIL</h2>
        <p class="window-copy" id="window-copy"></p>
        <div class="tag-row" id="window-tags"></div>
        <a class="project-link" id="project-link" href="about.html">페이지 보기 →</a>
      </div>
    </article>
  </div>

  <script>
    const desktop = document.querySelector("#desktop");
    const icons = [...document.querySelectorAll(".project-icon")];
    const modal = document.querySelector("#modal");
    const closeButton = modal.querySelector(".close");
    let lastFocused = null;

    const projects = {
      "NAENGIL": {
        kicker: "App planning · UX/UI",
        copy: "냉장고 속 재료를 한눈에 확인하고, 오늘의 식단을 추천받는 생활 관리 앱입니다. 사용자 흐름부터 화면 구조, 데이터와 예외 상황까지 설계합니다.",
        tags: ["서비스 기획", "UX/UI", "프로토타입", "Design System"],
        href: "naengil.html"
      },
      "HOME TABLE": {
        kicker: "Food archive · Content",
        copy: "직접 만든 집밥과 반찬을 정갈한 사진과 쉬운 이야기로 기록합니다. 냉장고 재료와 실제 식생활을 콘텐츠로 연결하는 아카이브입니다.",
        tags: ["집밥 사진", "콘텐츠 기획", "블로그", "Short-form"],
        href: "home-table.html"
      },
      "BRANDING": {
        kicker: "Brand identity",
        copy: "NJNAVO라는 이름에 담긴 생각부터 워드마크, 색상, 언어와 적용 방식까지 브랜드가 만들어지는 과정을 기록합니다.",
        tags: ["Naming", "Identity", "Logo Process", "Guideline"],
        href: "branding.html"
      },
      "QGIS": {
        kicker: "Spatial data · Visualization",
        copy: "흩어진 공간정보를 목적에 맞게 정리하고 지도 위에 시각화합니다. 복잡한 데이터를 사람들이 이해하기 쉬운 정보로 바꾸는 작업입니다.",
        tags: ["QGIS", "공간정보", "데이터 정리", "지도 시각화"],
        href: "qgis.html"
      },
      "WEB & CONTENT": {
        kicker: "Web · Visual content",
        copy: "웹페이지, 카드뉴스, 영상과 다양한 디지털 콘텐츠를 목적과 사용자에 맞춰 구조화하고 제작한 작업을 모았습니다.",
        tags: ["Web Design", "HTML/CSS", "Card News", "Video"],
        href: "web-content.html"
      },
      "ABOUT": {
        kicker: "Planner · Designer",
        copy: "사용자의 시선에서 문제를 발견하고, 복잡한 생각을 구조로 정리해 실제 결과물까지 연결합니다. 웹·콘텐츠·데이터 경험을 바탕으로 계속 배우고 만드는 중입니다.",
        tags: ["기획", "구조화", "문제 해결", "사용자 중심"],
        href: "about.html"
      },
      "CONTACT": {
        kicker: "Let’s work together",
        copy: "프로젝트와 채용에 관한 연락처가 들어갈 자리입니다. 최종 홈페이지에서는 이메일과 이력서 링크를 연결할 수 있습니다.",
        tags: ["Email", "Resume", "NJNAVO"],
        href: "#"
      }
    };

    function openProject(name, trigger) {
      const data = projects[name] || projects.ABOUT;
      lastFocused = trigger || document.activeElement;
      document.querySelector("#window-label").textContent = `NJNAVO / ${name}`;
      document.querySelector("#window-kicker").textContent = data.kicker;
      document.querySelector("#window-heading").textContent = name;
      document.querySelector("#window-copy").textContent = data.copy;
      document.querySelector("#window-tags").innerHTML =
        data.tags.map(tag => `<span class="tag">${tag}</span>`).join("");
      const projectLink = document.querySelector("#project-link");
      projectLink.href = data.href;
      projectLink.textContent = name === "CONTACT" ? "연락처 준비 중" : "페이지 보기 →";
      projectLink.style.pointerEvents = name === "CONTACT" ? "none" : "";
      modal.classList.add("open");
      document.body.style.overflow = "hidden";
      closeButton.focus();
    }

    function closeProject() {
      modal.classList.remove("open");
      document.body.style.overflow = "";
      lastFocused?.focus();
    }

    document.querySelectorAll("[data-project]").forEach(button => {
      button.addEventListener("click", () => openProject(button.dataset.project, button));
    });

    document.querySelectorAll("[data-open]").forEach(button => {
      button.addEventListener("click", () => openProject(button.dataset.open, button));
    });

    closeButton.addEventListener("click", closeProject);
    modal.addEventListener("click", event => {
      if (event.target === modal) closeProject();
    });

    window.addEventListener("keydown", event => {
      if (event.key === "Escape" && modal.classList.contains("open")) closeProject();
    });

    /* 아이콘 배열이 흐트러져 보이지 않도록 마우스 회피 움직임은 제거했습니다.
       개별 아이콘에 마우스를 올렸을 때 살짝 올라가는 효과는 CSS로 유지됩니다. */
  </script>
</body>
</html>
